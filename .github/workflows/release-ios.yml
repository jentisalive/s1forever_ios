name: Publish iOS preview release
on:
  push:
    paths:
      - '.github/workflows/release-ios.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '40567417801'
      BUILD_COMMIT: '4e1011ccdc1a65be418451d0791ed1b4df041f2f'
      RELEASE_TAG: 'v1.5.0-ios-preview.3'
    steps:
      - name: Verify and download successful iOS build
        shell: bash
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .conclusion)"
          commit="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)"
          test "$conclusion" = success
          test "$commit" = "$BUILD_COMMIT"
          # Tag the publishing workflow commit only when app sources match the tested build.
          changed="$(gh api "repos/$GH_REPO/compare/$BUILD_COMMIT...$GITHUB_SHA" --jq '.files[].filename')"
          test "$changed" = ".github/workflows/release-ios.yml"
          gh run download "$BUILD_RUN" --name SonicForever-iOS --dir release-assets
          test -s release-assets/SonicForever-iOS.ipa
          test -s release-assets/SonicForever-iOS.tipa
          unzip -tq release-assets/SonicForever-iOS.ipa
      - name: Publish preview with installable packages
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          iOS Preview 3 fixes the startup failures in the earlier previews.
          
          ## Fixes
          - Stage all 328 Forever scripts under Data/Scripts so the engine can load them.
          - Adapt legacy events, function declarations, input names and fade operations to the current script compiler.
          - Restore the priority, collision and platform aliases expected by Forever.
          - Register the missing frame-rate callbacks that caused a crash while opening the main menu.
          - Use the standalone mobile RSDK revision and refresh the previously installed bundled mod on first launch.
          - Keep the progress bar and improved data importer from Preview 2.
          
          ## Update and install
          Install the .ipa or .tipa as an update through your compatible installer. Existing Data.rsdk and save files remain in the app's Documents folder.
          For a new installation, choose your own Sonic 1 (2013) Data.rsdk when prompted.
          
          Requires iOS 15 or later. The IPA and TIPA contain the same app.
          
          ## Validation
          The iOS compilation and packaging passed. A headless runtime test with Sonic 1 data passed title screen → main menu → save selection → Green Hill Zone Act 1 with simulated mobile input and no script errors. Rendering and controls still need verification on an actual iPhone.
          
          The original Sonic 1 Data.rsdk is not included. Original game: SEGA / Sonic Team. Forever: Team Forever and credited contributors. Engine: RSDKModding, Rubberduckycooly and RMGRich; original RSDK by Christian Whitehead.
          
          Built from commit 4e1011ccdc1a65be418451d0791ed1b4df041f2f in workflow run 40567417801.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Sonic Forever 1.5.0 — iOS Preview 3" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/SonicForever-iOS.ipa release-assets/SonicForever-iOS.tipa --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file notes.md
